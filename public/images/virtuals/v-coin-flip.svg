<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2A164D"/>
      <stop offset="100%" stop-color="#0B061A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Glowing Grid -->
  <g opacity="0.15" stroke="#FFD54F" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="250" r="220" fill="#FFC107" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="150" r="100" fill="#00E676" opacity="0.1" filter="url(#glow)"/>

  <!-- Main 3D Golden Coin -->
  <g transform="translate(400, 240) rotate(-15)">
    <!-- Coin Edge -->
    <ellipse cx="0" cy="16" rx="130" ry="110" fill="#B56500"/>
    <ellipse cx="0" cy="12" rx="130" ry="110" fill="#D87D00"/>
    <ellipse cx="0" cy="8" rx="130" ry="110" fill="#F59E0B"/>

    <!-- Coin Face -->
    <ellipse cx="0" cy="0" rx="130" ry="110" fill="url(#gold)" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="110" ry="92" fill="none" stroke="#FFF59D" stroke-width="4" opacity="0.9"/>

    <!-- Star Emblem -->
    <path d="M0 -45 L12 -15 L42 -12 L18 10 L25 40 L0 24 L-25 40 L-18 10 L-42 -12 L-12 -15 Z" fill="#FFF8E1" filter="url(#glow)"/>

    <!-- Text -->
    <text x="0" y="65" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="4">COIN FLIP</text>
  </g>

  <!-- Floating Coins -->
  <g transform="translate(180, 140) scale(0.5) rotate(25)">
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="url(#gold)" filter="url(#glow)"/>
    <text x="0" y="12" font-family="Arial Black" font-size="36" fill="#FFF" text-anchor="middle">H</text>
  </g>
  <g transform="translate(620, 320) scale(0.6) rotate(-35)">
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="url(#gold)" filter="url(#glow)"/>
    <text x="0" y="12" font-family="Arial Black" font-size="36" fill="#FFF" text-anchor="middle">T</text>
  </g>

  <!-- Badge Banner -->
  <rect x="30" y="30" width="170" height="36" rx="10" fill="#00E676" filter="url(#glow)"/>
  <text x="115" y="54" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle">2X STREAK WIN</text>
</svg>
